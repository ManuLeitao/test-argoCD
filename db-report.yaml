apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-report
  labels:
    app.kubernetes.io/name: db-report
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-report
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: postgres:17-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-auth
                      key: POSTGRES_PASSWORD
              command: ["psql"]
              args: ["-h", "db", "-U", "postgres", "-v", "ON_ERROR_STOP=1", "-c", "SELECT now(), count(*) AS lignes FROM preuves;"]
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
