apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EpitechMscProPromo2027/T-CLO-901-MLH-9-1-kube-5.git
    targetRevision: main
    path: gitops-app/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true